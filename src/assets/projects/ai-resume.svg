<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAIResume" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d29"/>
      <stop offset="100%" stop-color="#14183d"/>
    </linearGradient>
    <linearGradient id="glowBtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgAIResume)"/>

  <!-- Subtle Grid -->
  <g stroke="#1b2138" stroke-width="1" opacity="0.6">
    <line x1="0" y1="50" x2="800" y2="50"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="350" x2="800" y2="350"/>
    <line x1="100" y1="0" x2="100" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/>
    <line x1="700" y1="0" x2="700" y2="450"/>
  </g>

  <!-- Window Container -->
  <rect x="60" y="35" width="680" height="380" rx="14" fill="#090d22" stroke="#252d50" stroke-width="1.5"/>
  
  <!-- Window Header -->
  <rect x="60" y="35" width="680" height="38" rx="14" fill="#101534"/>
  <rect x="60" y="59" width="680" height="14" fill="#101534"/>
  <circle cx="85" cy="54" r="5" fill="#ef4444"/>
  <circle cx="102" cy="54" r="5" fill="#eab308"/>
  <circle cx="119" cy="54" r="5" fill="#22c55e"/>
  <text x="400" y="58" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">AI-Resume-Builder · Next.js 14 App Router · OpenAI GPT-4</text>

  <!-- Left Form / Generation Panel -->
  <rect x="80" y="88" width="310" height="305" rx="8" fill="#101736" stroke="#1d2650" stroke-width="1"/>
  <text x="100" y="118" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700">✨ AI Prompt &amp; Content Generator</text>
  
  <!-- Input box mock 1 -->
  <text x="100" y="148" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="600">TARGET ROLE / TITLE</text>
  <rect x="100" y="156" width="270" height="32" rx="6" fill="#0a0f28" stroke="#263160" stroke-width="1"/>
  <text x="112" y="177" fill="#e2e8f0" font-family="sans-serif" font-size="11">Senior Full-Stack Engineer</text>

  <!-- Input box mock 2 -->
  <text x="100" y="212" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="600">KEY SKILLS &amp; EXPERIENCE</text>
  <rect x="100" y="220" width="270" height="55" rx="6" fill="#0a0f28" stroke="#263160" stroke-width="1"/>
  <text x="112" y="240" fill="#94a3b8" font-family="sans-serif" font-size="10">TypeScript, Next.js 14, Cloud APIs, CI/CD...</text>

  <!-- Generate Button -->
  <rect x="100" y="290" width="270" height="36" rx="8" fill="url(#glowBtn)"/>
  <text x="235" y="313" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">⚡ Generate Tailored Resume</text>

  <!-- ATS Metric Box -->
  <rect x="100" y="340" width="270" height="38" rx="6" fill="#0c182b" stroke="#0284c7" stroke-width="1"/>
  <text x="115" y="363" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="700">ATS Compliance Score: 96 / 100</text>

  <!-- Right: Live Interactive Document Sheet -->
  <rect x="410" y="88" width="310" height="305" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  
  <!-- Resume Sheet Header -->
  <rect x="430" y="108" width="160" height="12" rx="3" fill="#0f172a"/>
  <rect x="430" y="126" width="200" height="7" rx="2" fill="#64748b"/>
  <line x1="430" y1="144" x2="700" y2="144" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Resume Summary -->
  <rect x="430" y="156" width="90" height="9" rx="2" fill="#2563eb"/>
  <rect x="430" y="172" width="265" height="6" rx="2" fill="#94a3b8"/>
  <rect x="430" y="184" width="245" height="6" rx="2" fill="#94a3b8"/>
  <rect x="430" y="196" width="210" height="6" rx="2" fill="#94a3b8"/>

  <!-- Resume Experience -->
  <rect x="430" y="220" width="100" height="9" rx="2" fill="#2563eb"/>
  <rect x="430" y="236" width="150" height="7" rx="2" fill="#1e293b"/>
  <rect x="430" y="249" width="260" height="5" rx="2" fill="#94a3b8"/>
  <rect x="430" y="259" width="240" height="5" rx="2" fill="#94a3b8"/>
  <rect x="430" y="269" width="250" height="5" rx="2" fill="#94a3b8"/>

  <!-- Export Pill -->
  <rect x="585" y="348" width="120" height="28" rx="6" fill="#1e293b"/>
  <text x="645" y="366" fill="#f8fafc" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">📄 Export PDF</text>
</svg>
