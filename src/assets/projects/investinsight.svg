<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgInvest" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071120"/>
      <stop offset="100%" stop-color="#0d1e34"/>
    </linearGradient>
    <linearGradient id="chartFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgInvest)"/>

  <!-- Subtle Grid -->
  <g stroke="#162942" stroke-width="1" opacity="0.6">
    <line x1="0" y1="50" x2="800" y2="50"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="350" x2="800" y2="350"/>
    <line x1="100" y1="0" x2="100" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/>
    <line x1="700" y1="0" x2="700" y2="450"/>
  </g>

  <!-- Window Container -->
  <rect x="60" y="35" width="680" height="380" rx="14" fill="#081426" stroke="#1d385c" stroke-width="1.5"/>
  
  <!-- Window Header -->
  <rect x="60" y="35" width="680" height="38" rx="14" fill="#0d213d"/>
  <rect x="60" y="59" width="680" height="14" fill="#0d213d"/>
  <circle cx="85" cy="54" r="5" fill="#ef4444"/>
  <circle cx="102" cy="54" r="5" fill="#eab308"/>
  <circle cx="119" cy="54" r="5" fill="#22c55e"/>
  <text x="400" y="58" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">InvestInsight · Stock Prediction &amp; Portfolio Analytics · LSTM + Prophet</text>

  <!-- Stock Symbol Header & Stats -->
  <text x="85" y="112" fill="#e2e8f0" font-family="sans-serif" font-size="18" font-weight="800">AAPL · NASDAQ</text>
  <text x="245" y="112" fill="#10b981" font-family="monospace" font-size="16" font-weight="700">$189.45  ▲ +2.34 (+1.25%)</text>

  <rect x="520" y="93" width="100" height="26" rx="6" fill="#0f2b4c" stroke="#255485" stroke-width="1"/>
  <text x="570" y="110" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">LSTM Model</text>

  <rect x="630" y="93" width="95" height="26" rx="6" fill="#0f2b4c" stroke="#255485" stroke-width="1"/>
  <text x="677" y="110" fill="#a78bfa" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">FB Prophet</text>

  <!-- Chart Area -->
  <rect x="80" y="135" width="640" height="185" rx="8" fill="#050e1b" stroke="#162e4f" stroke-width="1"/>

  <!-- Grid lines inside chart -->
  <line x1="80" y1="180" x2="720" y2="180" stroke="#102540" stroke-width="1" stroke-dasharray="2,3"/>
  <line x1="80" y1="225" x2="720" y2="225" stroke="#102540" stroke-width="1" stroke-dasharray="2,3"/>
  <line x1="80" y1="270" x2="720" y2="270" stroke="#102540" stroke-width="1" stroke-dasharray="2,3"/>

  <!-- Candlesticks / historical bars -->
  <g stroke="#10b981" stroke-width="1.5">
    <line x1="120" y1="250" x2="120" y2="280"/><rect x="116" y="258" width="8" height="15" fill="#10b981"/>
    <line x1="150" y1="240" x2="150" y2="270"/><rect x="146" y="248" width="8" height="14" fill="#10b981"/>
    <line x1="180" y1="230" x2="180" y2="265"/><rect x="176" y="235" width="8" height="20" fill="#ef4444" stroke="#ef4444"/>
    <line x1="210" y1="210" x2="210" y2="250"/><rect x="206" y="218" width="8" height="18" fill="#10b981"/>
    <line x1="240" y1="200" x2="240" y2="240"/><rect x="236" y="206" width="8" height="22" fill="#10b981"/>
  </g>

  <!-- Prophet forecast area -->
  <polygon points="260,205 320,190 380,180 440,165 500,150 560,140 620,130 680,120 680,240 620,230 560,225 500,220 440,215 380,220 320,225 260,225" fill="#a78bfa" opacity="0.12"/>
  
  <!-- Actual curve + fill -->
  <polygon points="100,280 140,265 180,250 220,225 260,205 310,195 360,185 410,175 470,160 530,152 590,140 650,132 700,125 700,310 100,310" fill="url(#chartFill)"/>
  
  <path d="M 100 280 Q 180 250 260 205 T 410 175 T 560 145 T 700 125" fill="none" stroke="#10b981" stroke-width="3"/>

  <!-- Forecast line dashed -->
  <path d="M 260 205 Q 360 180 460 155 T 700 115" fill="none" stroke="#a78bfa" stroke-width="2.5" stroke-dasharray="5,4"/>

  <!-- Forecast Label -->
  <circle cx="560" cy="145" r="5" fill="#a78bfa"/>
  <rect x="530" y="160" width="115" height="20" rx="4" fill="#081426" stroke="#a78bfa" stroke-width="1"/>
  <text x="587" y="174" fill="#c4b5fd" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">LSTM: +14.2% (90d)</text>

  <!-- Lower Indicators Strip -->
  <rect x="80" y="332" width="200" height="65" rx="6" fill="#050e1b" stroke="#162e4f" stroke-width="1"/>
  <text x="95" y="352" fill="#94a3b8" font-family="sans-serif" font-size="10">RSI (14 PERIOD)</text>
  <text x="95" y="380" fill="#38bdf8" font-family="monospace" font-size="18" font-weight="700">62.8  <tspan font-size="11" fill="#94a3b8">Bullish</tspan></text>

  <rect x="300" y="332" width="200" height="65" rx="6" fill="#050e1b" stroke="#162e4f" stroke-width="1"/>
  <text x="315" y="352" fill="#94a3b8" font-family="sans-serif" font-size="10">VOLATILITY (ANNUAL)</text>
  <text x="315" y="380" fill="#f59e0b" font-family="monospace" font-size="18" font-weight="700">18.4%  <tspan font-size="11" fill="#94a3b8">Moderate</tspan></text>

  <rect x="520" y="332" width="200" height="65" rx="6" fill="#050e1b" stroke="#162e4f" stroke-width="1"/>
  <text x="535" y="352" fill="#94a3b8" font-family="sans-serif" font-size="10">DATA STREAM</text>
  <text x="535" y="380" fill="#10b981" font-family="monospace" font-size="15" font-weight="700">yFinance API · Live</text>
</svg>
