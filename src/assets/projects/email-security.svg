<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSec" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d1e"/>
      <stop offset="100%" stop-color="#0d1730"/>
    </linearGradient>
    <linearGradient id="alertGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#885cf5"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgSec)"/>

  <!-- Subtle Cyber Matrix Grid -->
  <g stroke="#152142" stroke-width="1" opacity="0.6">
    <line x1="0" y1="45" x2="800" y2="45"/>
    <line x1="0" y1="135" x2="800" y2="135"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="315" x2="800" y2="315"/>
    <line x1="0" y1="405" x2="800" y2="405"/>
    <line x1="120" y1="0" x2="120" y2="450"/>
    <line x1="280" y1="0" x2="280" y2="450"/>
    <line x1="440" y1="0" x2="440" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="740" y1="0" x2="740" y2="450"/>
  </g>

  <!-- Main Window Frame -->
  <rect x="40" y="30" width="720" height="390" rx="12" fill="#091224" stroke="#1d2f57" stroke-width="1.5"/>

  <!-- Title bar -->
  <rect x="40" y="30" width="720" height="38" rx="12" fill="#0e1b38"/>
  <rect x="40" y="54" width="720" height="14" fill="#0e1b38"/>
  <circle cx="65" cy="49" r="5" fill="#ef4444"/>
  <circle cx="82" cy="49" r="5" fill="#eab308"/>
  <circle cx="99" cy="49" r="5" fill="#22c55e"/>
  <text x="400" y="53" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Email Security Analyst · Phishing Detection &amp; Forensic Analyzer (Flask · Scikit-Learn · RFC 7208)</text>

  <!-- Threat Score Banner (Top Right) -->
  <rect x="520" y="80" width="220" height="42" rx="8" fill="#1e1018" stroke="#ef4444" stroke-width="1.2"/>
  <circle cx="540" cy="101" r="6" fill="#ef4444"/>
  <text x="555" y="96" fill="#fca5a5" font-family="sans-serif" font-size="10" font-weight="700">COMPOSITE THREAT SCORE</text>
  <text x="555" y="113" fill="#ef4444" font-family="monospace" font-size="15" font-weight="800">91.4% · HIGH RISK PHISH</text>

  <!-- Status / Target Header (Top Left) -->
  <text x="60" y="97" fill="#6366f1" font-family="monospace" font-size="11" font-weight="700">INSPECTION TARGET: MSG_ID #8892-SEC</text>
  <text x="60" y="116" fill="#e2e8f0" font-family="sans-serif" font-size="14" font-weight="700">Subject: "URGENT: Microsoft 365 Password Expiration Alert"</text>

  <!-- Left Column: Header Verification Panel -->
  <rect x="60" y="132" width="330" height="180" rx="8" fill="#0d1830" stroke="#1c2d52" stroke-width="1"/>
  
  <text x="76" y="154" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="700">SENDER PROTOCOL AUTHENTICATION</text>

  <!-- Sender row -->
  <text x="76" y="174" fill="#94a3b8" font-family="monospace" font-size="10">From: <tspan fill="#f87171">security-update@m1crosoft-auth-sec.net</tspan></text>
  <text x="76" y="190" fill="#94a3b8" font-family="monospace" font-size="10">Origin IP: <tspan fill="#e2e8f0">185.220.101.4 (TOR Exit Node)</tspan></text>

  <!-- SPF Pill -->
  <g transform="translate(76, 204)">
    <rect width="298" height="24" rx="4" fill="#201119" stroke="#7f1d1d" stroke-width="1"/>
    <circle cx="12" cy="12" r="4" fill="#ef4444"/>
    <text x="24" y="16" fill="#fca5a5" font-family="monospace" font-size="10" font-weight="700">SPF:</text>
    <text x="60" y="16" fill="#f87171" font-family="monospace" font-size="10">FAIL (IP not in spf.protection.outlook.com)</text>
  </g>

  <!-- DKIM Pill -->
  <g transform="translate(76, 234)">
    <rect width="298" height="24" rx="4" fill="#201119" stroke="#7f1d1d" stroke-width="1"/>
    <circle cx="12" cy="12" r="4" fill="#ef4444"/>
    <text x="24" y="16" fill="#fca5a5" font-family="monospace" font-size="10" font-weight="700">DKIM:</text>
    <text x="68" y="16" fill="#f87171" font-family="monospace" font-size="10">FAIL (Invalid cryptographic body hash)</text>
  </g>

  <!-- DMARC Pill -->
  <g transform="translate(76, 264)">
    <rect width="298" height="24" rx="4" fill="#201119" stroke="#7f1d1d" stroke-width="1"/>
    <circle cx="12" cy="12" r="4" fill="#ef4444"/>
    <text x="24" y="16" fill="#fca5a5" font-family="monospace" font-size="10" font-weight="700">DMARC:</text>
    <text x="75" y="16" fill="#f87171" font-family="monospace" font-size="10">FAIL (Policy: Reject / Quarantine)</text>
  </g>

  <text x="76" y="303" fill="#4ade80" font-family="monospace" font-size="9.5">✓ RFC 7208 / RFC 6376 / RFC 7489 DNS queried</text>

  <!-- Right Column: NLP & TF-IDF Extraction Panel -->
  <rect x="405" y="132" width="335" height="180" rx="8" fill="#0d1830" stroke="#1c2d52" stroke-width="1"/>
  
  <text x="420" y="154" fill="#a78bfa" font-family="monospace" font-size="11" font-weight="700">NLP FEATURE EXTRACTION (TF-IDF + LOGISTIC REG.)</text>
  
  <!-- Keywords breakdown -->
  <g transform="translate(420, 168)">
    <text x="0" y="10" fill="#cbd5e1" font-family="monospace" font-size="10">"urgent action"</text>
    <rect x="130" y="2" width="130" height="8" rx="4" fill="#1e293b"/>
    <rect x="130" y="2" width="116" height="8" rx="4" fill="url(#alertGrad)"/>
    <text x="268" y="10" fill="#fca5a5" font-family="monospace" font-size="9" font-weight="700">+0.89</text>
  </g>

  <g transform="translate(420, 192)">
    <text x="0" y="10" fill="#cbd5e1" font-family="monospace" font-size="10">"account suspended"</text>
    <rect x="130" y="2" width="130" height="8" rx="4" fill="#1e293b"/>
    <rect x="130" y="2" width="105" height="8" rx="4" fill="url(#alertGrad)"/>
    <text x="268" y="10" fill="#fca5a5" font-family="monospace" font-size="9" font-weight="700">+0.81</text>
  </g>

  <g transform="translate(420, 216)">
    <text x="0" y="10" fill="#cbd5e1" font-family="monospace" font-size="10">"verify credentials"</text>
    <rect x="130" y="2" width="130" height="8" rx="4" fill="#1e293b"/>
    <rect x="130" y="2" width="98" height="8" rx="4" fill="url(#alertGrad)"/>
    <text x="268" y="10" fill="#fca5a5" font-family="monospace" font-size="9" font-weight="700">+0.75</text>
  </g>

  <g transform="translate(420, 240)">
    <text x="0" y="10" fill="#cbd5e1" font-family="monospace" font-size="10">"reset password"</text>
    <rect x="130" y="2" width="130" height="8" rx="4" fill="#1e293b"/>
    <rect x="130" y="2" width="88" height="8" rx="4" fill="url(#barGrad)"/>
    <text x="268" y="10" fill="#c4b5fd" font-family="monospace" font-size="9" font-weight="700">+0.68</text>
  </g>

  <!-- Scikit-learn Badge -->
  <rect x="420" y="266" width="150" height="24" rx="4" fill="#132442" stroke="#2563eb" stroke-width="1"/>
  <text x="495" y="282" fill="#60a5fa" font-family="monospace" font-size="9.5" font-weight="700" text-anchor="middle">Scikit-learn · Acc: 94.2%</text>

  <rect x="580" y="266" width="150" height="24" rx="4" fill="#161e38" stroke="#6366f1" stroke-width="1"/>
  <text x="655" y="282" fill="#a5b4fc" font-family="monospace" font-size="9.5" font-weight="700" text-anchor="middle">Flask API Endpoint: POST</text>

  <!-- Bottom Forensics Strip -->
  <rect x="60" y="325" width="680" height="75" rx="8" fill="#091224" stroke="#1c2d52" stroke-width="1"/>
  
  <text x="76" y="347" fill="#f59e0b" font-family="monospace" font-size="10.5" font-weight="700">⚠ SUSPICIOUS URL &amp; ATTACHMENT FORENSICS</text>
  
  <text x="76" y="367" fill="#94a3b8" font-family="monospace" font-size="10">Parsed Target Link: <tspan fill="#fca5a5">hxxp://m1crosoft-auth-sec.net/login/token?sess=99281a</tspan> <tspan fill="#eab308">[Punycode Spoof]</tspan></text>
  
  <text x="76" y="386" fill="#94a3b8" font-family="monospace" font-size="10">Attachment Analysis: <tspan fill="#f87171">Security_Notice.pdf.exe</tspan> · MIME: application/x-dosexec · Status: <tspan fill="#4ade80">QUARANTINED</tspan></text>
</svg>
