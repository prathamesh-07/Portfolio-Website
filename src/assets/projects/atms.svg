<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAtms" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c1d"/>
      <stop offset="100%" stop-color="#0d1836"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#885cf5"/>
    </linearGradient>
    <linearGradient id="secPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgAtms)"/>

  <!-- Matrix Grid -->
  <g stroke="#142142" stroke-width="1" opacity="0.6">
    <line x1="0" y1="45" x2="800" y2="45"/>
    <line x1="0" y1="135" x2="800" y2="135"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="315" x2="800" y2="315"/>
    <line x1="0" y1="405" x2="800" y2="405"/>
    <line x1="120" y1="0" x2="120" y2="450"/>
    <line x1="280" y1="0" x2="280" y2="450"/>
    <line x1="440" y1="0" x2="440" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="740" y1="0" x2="740" y2="450"/>
