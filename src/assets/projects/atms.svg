    <text x="534" y="22" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="600">DECOMMISSIONED</text>
    <text x="534" y="47" fill="#cbd5e1" font-family="monospace" font-size="20" font-weight="800">88 <tspan font-size="11" fill="#64748b">retired</tspan></text>
  </g>

  <!-- Asset Table Container -->
  <rect x="60" y="204" width="680" height="155" rx="8" fill="#0c162f" stroke="#1c2d52" stroke-width="1"/>

