  <rect x="40" y="54" width="720" height="14" fill="#0d1b38"/>
  <circle cx="65" cy="49" r="5" fill="#ef4444"/>
  <circle cx="82" cy="49" r="5" fill="#eab308"/>
  <circle cx="99" cy="49" r="5" fill="#22c55e"/>
  <text x="400" y="53" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" text-anchor="middle">ATMS · Enterprise Asset Management System · React · MongoDB · Role-Based Access Control</text>

  <!-- Top User Profile & RBAC Role Bar -->
  <rect x="60" y="80" width="680" height="42" rx="8" fill="#0c1730" stroke="#1b2a4d" stroke-width="1"/>
  
  <circle cx="82" cy="101" r="12" fill="url(#badgeGrad)"/>
  <text x="82" y="106" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="900" text-anchor="middle">PC</text>
  
  <text x="105" y="97" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="700">Prathamesh Chiddarwar</text>
  <text x="105" y="112" fill="#94a3b8" font-family="monospace" font-size="10">SecOps System Administrator · UID #4092</text>

  <!-- RBAC Pill Badges -->
  <rect x="390" y="88" width="165" height="26" rx="6" fill="#132347" stroke="#3b82f6" stroke-width="1"/>
  <circle cx="404" cy="101" r="4" fill="#60a5fa"/>
  <text x="415" y="105" fill="#93c5fd" font-family="monospace" font-size="9.5" font-weight="700">RBAC: LEVEL 4 (FULL)</text>

  <rect x="565" y="88" width="160" height="26" rx="6" fill="#0b2920" stroke="#10b981" stroke-width="1"/>
  <circle cx="579" cy="101" r="4" fill="#10b981"/>
  <text x="590" y="105" fill="#6ee7b7" font-family="monospace" font-size="9.5" font-weight="700">AUDIT LOG: IMMUTABLE</text>

