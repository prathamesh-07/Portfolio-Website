  <text x="160" y="252" fill="#f1f5f9" font-family="sans-serif" font-size="10" font-weight="600">Lenovo ThinkPad P16 Gen 2 (64GB, i9)</text>
  <text x="395" y="252" fill="#cbd5e1" font-family="monospace" font-size="9.5">Cyber Forensics</text>
  <text x="515" y="252" fill="#a78bfa" font-family="monospace" font-size="9.5">SecOps Only</text>
  <rect x="635" y="240" width="75" height="18" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="672" y="252" fill="#34d399" font-family="monospace" font-size="9" font-weight="800" text-anchor="middle">ACTIVE</text>

