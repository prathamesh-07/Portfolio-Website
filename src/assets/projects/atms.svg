  <text x="76" y="284" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="700">SW-4410</text>
  <text x="160" y="284" fill="#f1f5f9" font-family="sans-serif" font-size="10" font-weight="600">Burp Suite Enterprise Scanner (5 Nodes)</text>
  <text x="395" y="284" fill="#cbd5e1" font-family="monospace" font-size="9.5">AppSec Alpha</text>
  <text x="515" y="284" fill="#f43f5e" font-family="monospace" font-size="9.5">Admin Only</text>
  <rect x="635" y="272" width="75" height="18" rx="4" fill="#2e1065" stroke="#8b5cf6" stroke-width="1"/>
  <text x="672" y="284" fill="#c084fc" font-family="monospace" font-size="9" font-weight="800" text-anchor="middle">LICENSED</text>

  <!-- Table Row 3 -->
  <line x1="60" y1="296" x2="740" y2="296" stroke="#182747" stroke-width="1"/>
  <text x="76" y="316" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="700">HW-8842</text>
  <text x="160" y="316" fill="#f1f5f9" font-family="sans-serif" font-size="10" font-weight="600">Dell PowerEdge R750 Cluster Node</text>
  <text x="395" y="316" fill="#cbd5e1" font-family="monospace" font-size="9.5">Infra Core</text>
  <text x="515" y="316" fill="#60a5fa" font-family="monospace" font-size="9.5">DevOps / Sec</text>
  <rect x="635" y="304" width="75" height="18" rx="4" fill="#172554" stroke="#3b82f6" stroke-width="1"/>
  <text x="672" y="316" fill="#93c5fd" font-family="monospace" font-size="9" font-weight="800" text-anchor="middle">HEALTHY</text>

  <!-- Table Row 4 -->
  <line x1="60" y1="328" x2="740" y2="328" stroke="#182747" stroke-width="1"/>
  <text x="76" y="348" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="700">SW-1092</text>
  <text x="160" y="348" fill="#f1f5f9" font-family="sans-serif" font-size="10" font-weight="600">Nessus Pro Network Vulnerability Engine</text>
  <text x="395" y="348" fill="#cbd5e1" font-family="monospace" font-size="9.5">NetSec Ops</text>
  <text x="515" y="348" fill="#a78bfa" font-family="monospace" font-size="9.5">SecOps Only</text>
  <rect x="635" y="336" width="75" height="18" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="672" y="348" fill="#34d399" font-family="monospace" font-size="9" font-weight="800" text-anchor="middle">ACTIVE</text>

  <!-- Bottom Database & Audit Footer -->
