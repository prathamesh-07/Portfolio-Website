  <text x="76" y="391" fill="#10b981" font-family="monospace" font-size="10" font-weight="700">● MongoDB ReplicaSet: CONNECTED</text>
  <text x="340" y="391" fill="#94a3b8" font-family="monospace" font-size="9.5">Immutable audit record #88492 signed with HMAC-SHA256.</text>
</svg>
