  <text x="76" y="222" fill="#6366f1" font-family="monospace" font-size="10" font-weight="800">ASSET ID</text>
  <text x="160" y="222" fill="#94a3b8" font-family="monospace" font-size="10" font-weight="700">SPECIFICATION / ASSET NAME</text>
