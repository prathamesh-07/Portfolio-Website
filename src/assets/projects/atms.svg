    <text x="14" y="47" fill="#f8fafc" font-family="monospace" font-size="20" font-weight="800">1,428 <tspan font-size="11" fill="#38bdf8">+12</tspan></text>

    <!-- Card 2 -->
    <rect x="173" width="160" height="58" rx="8" fill="#0d1833" stroke="#1c2d52" stroke-width="1"/>
    <text x="187" y="22" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="600">ACTIVE IN SERVICE</text>
    <text x="187" y="47" fill="#34d399" font-family="monospace" font-size="20" font-weight="800">1,294 <tspan font-size="11" fill="#94a3b8">90.6%</tspan></text>

    <!-- Card 3 -->
    <rect x="346" width="160" height="58" rx="8" fill="#0d1833" stroke="#1c2d52" stroke-width="1"/>
    <text x="360" y="22" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="600">IN AUDIT / REPAIR</text>
