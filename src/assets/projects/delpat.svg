<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDelpat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1030"/>
      <stop offset="100%" stop-color="#151030"/>
    </linearGradient>
    <linearGradient id="indGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#885cf5"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgDelpat)"/>
  
  <!-- Subtle Grid -->
  <g stroke="#1e212e" stroke-width="1" opacity="0.6">
    <line x1="0" y1="50" x2="800" y2="50"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="350" x2="800" y2="350"/>
    <line x1="100" y1="0" x2="100" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/>
    <line x1="700" y1="0" x2="700" y2="450"/>
  </g>

  <!-- Window Container -->
  <rect x="60" y="40" width="680" height="370" rx="14" fill="#070a1d" stroke="#2a2e45" stroke-width="1.5"/>
  
  <!-- Title bar -->
  <rect x="60" y="40" width="680" height="40" rx="14" fill="#0f1430"/>
  <rect x="60" y="66" width="680" height="14" fill="#0f1430"/>
  <circle cx="85" cy="60" r="5" fill="#ef4444"/>
  <circle cx="102" cy="60" r="5" fill="#eab308"/>
  <circle cx="119" cy="60" r="5" fill="#22c55e"/>
  <text x="400" y="64" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" text-anchor="middle">delpat-cloud-admin.internal · AWS EC2 · Production Cluster</text>

  <!-- Sidebar -->
  <rect x="75" y="95" width="160" height="295" rx="8" fill="#111638" stroke="#1f2445" stroke-width="1"/>
  <text x="95" y="125" fill="#6366f1" font-family="monospace" font-size="11" font-weight="700">SERVICES</text>
  <rect x="90" y="140" width="130" height="28" rx="6" fill="#6366f1" opacity="0.2"/>
  <text x="105" y="158" fill="#a5b4fc" font-family="sans-serif" font-size="11" font-weight="600">⚡ API Gateway</text>
  <text x="105" y="195" fill="#94a3b8" font-family="sans-serif" font-size="11">🔒 JWT Auth Server</text>
  <text x="105" y="230" fill="#94a3b8" font-family="sans-serif" font-size="11">📦 React Components</text>
  <text x="105" y="265" fill="#94a3b8" font-family="sans-serif" font-size="11">🔄 CI/CD Workflows</text>
  <text x="105" y="300" fill="#94a3b8" font-family="sans-serif" font-size="11">☁️ Vercel / EC2 Node</text>

  <!-- Main dashboard panel -->
  <rect x="250" y="95" width="470" height="135" rx="8" fill="#111638" stroke="#1f2445" stroke-width="1"/>
  <text x="270" y="125" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="700">Production Systems Cluster Status</text>
  
  <rect x="270" y="145" width="130" height="65" rx="6" fill="#0b0e24" stroke="#252a4e" stroke-width="1"/>
  <text x="285" y="168" fill="#94a3b8" font-family="sans-serif" font-size="10">UPTIME (SLA)</text>
  <text x="285" y="196" fill="#10b981" font-family="monospace" font-size="18" font-weight="700">99.98%</text>

  <rect x="420" y="145" width="130" height="65" rx="6" fill="#0b0e24" stroke="#252a4e" stroke-width="1"/>
  <text x="435" y="168" fill="#94a3b8" font-family="sans-serif" font-size="10">APPS DEPLOYED</text>
  <text x="435" y="196" fill="#6366f1" font-family="monospace" font-size="18" font-weight="700">6+ Live</text>

  <rect x="570" y="145" width="130" height="65" rx="6" fill="#0b0e24" stroke="#252a4e" stroke-width="1"/>
  <text x="585" y="168" fill="#94a3b8" font-family="sans-serif" font-size="10">AUTH PROTOCOL</text>
  <text x="585" y="196" fill="#885cf5" font-family="monospace" font-size="16" font-weight="700">JWT / RBAC</text>

  <!-- Lower Architecture row -->
  <rect x="250" y="245" width="470" height="145" rx="8" fill="#111638" stroke="#1f2445" stroke-width="1"/>
  <text x="270" y="275" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="700">Client Migration Pipeline (WordPress → React Single-Page Application)</text>
  
  <!-- Flow nodes -->
  <rect x="270" y="295" width="105" height="40" rx="6" fill="#1f1838" stroke="#885cf5" stroke-width="1.2"/>
  <text x="282" y="320" fill="#c4b5fd" font-family="sans-serif" font-size="10" font-weight="600">Legacy CMS</text>

  <line x1="380" y1="315" x2="410" y2="315" stroke="#6366f1" stroke-width="2" stroke-dasharray="3,3"/>
  <polygon points="412,315 407,311 407,319" fill="#6366f1"/>

  <rect x="417" y="295" width="125" height="40" rx="6" fill="#132347" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="430" y="320" fill="#7dd3fc" font-family="sans-serif" font-size="10" font-weight="600">REST API Layer</text>

  <line x1="547" y1="315" x2="577" y2="315" stroke="#6366f1" stroke-width="2" stroke-dasharray="3,3"/>
  <polygon points="579,315 574,311 574,319" fill="#6366f1"/>

  <rect x="584" y="295" width="120" height="40" rx="6" fill="#182e2c" stroke="#10b981" stroke-width="1.2"/>
  <text x="597" y="320" fill="#6ee7b7" font-family="sans-serif" font-size="10" font-weight="600">React + AWS EC2</text>

  <text x="270" y="365" fill="#64748b" font-family="monospace" font-size="10">✓ Zero downtime migration · Reusable design system tokens applied</text>
</svg>
