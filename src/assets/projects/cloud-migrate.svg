<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCloud" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060c1d"/>
      <stop offset="100%" stop-color="#0b1736"/>
    </linearGradient>
    <linearGradient id="awsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9900"/>
      <stop offset="100%" stop-color="#ff6600"/>
    </linearGradient>
    <linearGradient id="gcpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285f4"/>
      <stop offset="100%" stop-color="#34a853"/>
    </linearGradient>
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9900"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4285f4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgCloud)"/>

  <!-- Network Grid -->
  <g stroke="#142142" stroke-width="1" opacity="0.6">
    <line x1="0" y1="45" x2="800" y2="45"/>
    <line x1="0" y1="135" x2="800" y2="135"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="315" x2="800" y2="315"/>
    <line x1="0" y1="405" x2="800" y2="405"/>
    <line x1="120" y1="0" x2="120" y2="450"/>
    <line x1="280" y1="0" x2="280" y2="450"/>
    <line x1="440" y1="0" x2="440" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="740" y1="0" x2="740" y2="450"/>
  </g>

  <!-- Main Window -->
  <rect x="40" y="30" width="720" height="390" rx="12" fill="#091326" stroke="#1d325c" stroke-width="1.5"/>

  <!-- Title bar -->
  <rect x="40" y="30" width="720" height="38" rx="12" fill="#0d1f3d"/>
  <rect x="40" y="54" width="720" height="14" fill="#0d1f3d"/>
  <circle cx="65" cy="49" r="5" fill="#ef4444"/>
  <circle cx="82" cy="49" r="5" fill="#eab308"/>
  <circle cx="99" cy="49" r="5" fill="#22c55e"/>
  <text x="400" y="53" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" text-anchor="middle">CloudMigrate · Multi-Cloud Data Orchestration (AWS S3 ➔ Google Cloud Storage · MD5 / SHA-256)</text>

  <!-- Control Header Bar -->
  <rect x="60" y="80" width="680" height="42" rx="8" fill="#0b1730" stroke="#1c2d52" stroke-width="1"/>
  <text x="76" y="105" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700">PIPELINE: s3-us-east-1 ➔ gcs-us-central1</text>
  
  <rect x="520" y="88" width="105" height="26" rx="6" fill="#142b47" stroke="#38bdf8" stroke-width="1"/>
  <text x="572" y="105" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">Next.js 14 UI</text>

  <rect x="635" y="88" width="95" height="26" rx="6" fill="#1e1836" stroke="#a855f7" stroke-width="1"/>
  <text x="682" y="105" fill="#c084fc" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">Python Async</text>

  <!-- Left Cloud Source Box: AWS S3 -->
  <rect x="60" y="134" width="200" height="155" rx="8" fill="#121b33" stroke="#ff9900" stroke-width="1.2"/>
  
  <rect x="75" y="146" width="32" height="32" rx="6" fill="url(#awsGrad)"/>
  <text x="91" y="167" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="900" text-anchor="middle">S3</text>
  
  <text x="115" y="159" fill="#ff9900" font-family="sans-serif" font-size="12" font-weight="800">SOURCE: AWS S3</text>
  <text x="115" y="174" fill="#94a3b8" font-family="monospace" font-size="9.5">us-east-1 (N. Virginia)</text>

  <text x="75" y="202" fill="#cbd5e1" font-family="monospace" font-size="10">Bucket: <tspan fill="#f8fafc">prod-media-archive</tspan></text>
  <text x="75" y="222" fill="#cbd5e1" font-family="monospace" font-size="10">Total Objects: <tspan fill="#38bdf8">14,280 files</tspan></text>
  <text x="75" y="242" fill="#cbd5e1" font-family="monospace" font-size="10">Total Size: <tspan fill="#e2e8f0">1.42 TB</tspan></text>
  <text x="75" y="268" fill="#22c55e" font-family="monospace" font-size="10" font-weight="700">● Boto3 Connector: ACTIVE</text>

  <!-- Center Transfer Pipeline -->
  <g transform="translate(275, 145)">
    <!-- Stream line -->
    <line x1="10" y1="65" x2="235" y2="65" stroke="url(#pipeGrad)" stroke-width="4"/>
    
    <!-- Moving Packets / Dots -->
    <circle cx="50" cy="65" r="5" fill="#ff9900"/>
    <circle cx="110" cy="65" r="5" fill="#818cf8"/>
    <circle cx="170" cy="65" r="5" fill="#38bdf8"/>
    <circle cx="225" cy="65" r="5" fill="#4285f4"/>

    <!-- Speed & metrics badge -->
    <rect x="42" y="15" width="165" height="32" rx="6" fill="#0d1d3b" stroke="#3b82f6" stroke-width="1"/>
    <text x="124" y="35" fill="#60a5fa" font-family="monospace" font-size="11" font-weight="800" text-anchor="middle">⚡ 850 MB/s LIVE PIPELINE</text>

    <!-- Progress Bar -->
    <rect x="25" y="85" width="200" height="14" rx="7" fill="#111827"/>
    <rect x="25" y="85" width="186" height="14" rx="7" fill="url(#pipeGrad)"/>
    <text x="125" y="96" fill="#ffffff" font-family="monospace" font-size="9" font-weight="800" text-anchor="middle">93% TRANSFERRED · 1.32 TB</text>

    <!-- ETA -->
    <text x="125" y="122" fill="#94a3b8" font-family="monospace" font-size="9.5" text-anchor="middle">Est. Remaining: 02m 14s · 0 Drops</text>
  </g>

  <!-- Right Cloud Destination Box: GCP GCS -->
  <rect x="540" y="134" width="200" height="155" rx="8" fill="#121b33" stroke="#4285f4" stroke-width="1.2"/>
  
  <rect x="555" y="146" width="32" height="32" rx="6" fill="url(#gcpGrad)"/>
  <text x="571" y="167" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="900" text-anchor="middle">G</text>

  <text x="595" y="159" fill="#60a5fa" font-family="sans-serif" font-size="12" font-weight="800">TARGET: GOOGLE CLOUD</text>
  <text x="595" y="174" fill="#94a3b8" font-family="monospace" font-size="9.5">us-central1 (Iowa)</text>

  <text x="555" y="202" fill="#cbd5e1" font-family="monospace" font-size="10">Bucket: <tspan fill="#f8fafc">gcs-analytics-lake</tspan></text>
  <text x="555" y="222" fill="#cbd5e1" font-family="monospace" font-size="10">Synchronized: <tspan fill="#34d399">13,280 files</tspan></text>
  <text x="555" y="242" fill="#cbd5e1" font-family="monospace" font-size="10">Storage Class: <tspan fill="#e2e8f0">Standard</tspan></text>
  <text x="555" y="268" fill="#22c55e" font-family="monospace" font-size="10" font-weight="700">● GCS Storage API: SYNCED</text>

  <!-- Bottom Verification & Hash Integrity Card -->
  <rect x="60" y="304" width="680" height="96" rx="8" fill="#0b152d" stroke="#1c2d52" stroke-width="1"/>
  
  <text x="76" y="325" fill="#38bdf8" font-family="monospace" font-size="10.5" font-weight="700">CRYPTOGRAPHIC INTEGRITY &amp; BITROT VERIFICATION ENGINE</text>

  <!-- MD5 Row -->
  <g transform="translate(76, 336)">
    <text x="0" y="12" fill="#94a3b8" font-family="monospace" font-size="9.5">MD5 Checksum:</text>
    <text x="110" y="12" fill="#e2e8f0" font-family="monospace" font-size="9.5">e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855</text>
    <rect x="525" y="0" width="68" height="18" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="559" y="12" fill="#34d399" font-family="monospace" font-size="9" font-weight="800" text-anchor="middle">MATCH 100%</text>
  </g>

  <!-- SHA-256 Row -->
  <g transform="translate(76, 360)">
    <text x="0" y="12" fill="#94a3b8" font-family="monospace" font-size="9.5">SHA-256 Digest:</text>
    <text x="110" y="12" fill="#e2e8f0" font-family="monospace" font-size="9.5">9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08</text>
    <rect x="525" y="0" width="68" height="18" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="559" y="12" fill="#34d399" font-family="monospace" font-size="9" font-weight="800" text-anchor="middle">VERIFIED</text>
  </g>

  <!-- Supabase logging audit -->
  <text x="76" y="392" fill="#a78bfa" font-family="monospace" font-size="9.5">✓ Audit logged to Supabase: Chunk 48/48 checksum confirmed. ZERO data corruption detected.</text>
</svg>
