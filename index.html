    <!-- Synchronous Document Load Check per Revision Brief -->
    <script>
      (function() {
        try {
          var isReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          var hasHash = window.location.hash && window.location.hash.length > 1;
          var nav = window.performance && window.performance.getEntriesByType && window.performance.getEntriesByType('navigation');
          var isBackForward = nav && nav.length > 0 && nav[0].type === 'back_forward';

          // LOADER_ROUTES: "all" or array e.g. ["/"]
          var allowedRoutes = ["/"];
          var path = window.location.pathname;
          var normPath = (path.length > 1 && path.endsWith('/')) ? path.slice(0, -1) : path;
          var isAllowed = allowedRoutes === 'all' || (Array.isArray(allowedRoutes) && (allowedRoutes.indexOf(path) !== -1 || allowedRoutes.indexOf(normPath) !== -1 || (normPath === '/index.html' && allowedRoutes.indexOf('/') !== -1)));

          if (isReduced || hasHash || isBackForward || !isAllowed) {
            document.documentElement.classList.add('loader-skip');
          }
        } catch (e) {}

        window.addEventListener('pageshow', function(e) {
          if (e.persisted) {
            document.documentElement.classList.add('loader-skip');
            var el = document.getElementById('app-loader');
            if (el) el.remove();
          }
        });
      })();
    </script>
    <style id="critical-loader-css">
      .loader-skip #app-loader {
        display: none !important;
      }
      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 100;
        background-color: #050816;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: opacity 400ms cubic-bezier(0.22, 1, 0.36, 1), transform 400ms cubic-bezier(0.22, 1, 0.36, 1);
        will-change: opacity, transform;
        pointer-events: auto;
      }
      #app-loader.loader-exiting {
        opacity: 0 !important;
        transform: translateY(-12px) !important;
        pointer-events: none !important;
      }
      .loader-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      .loader-icon {
        width: 96px;
        height: 96px;
        animation: loaderIconEntrance 400ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      .loader-meta {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        animation: loaderMetaEntrance 300ms ease-out 100ms forwards;
        opacity: 0;
      }
      .loader-label {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        color: #94a3b8;
        font-family: Inter, system-ui, -apple-system, sans-serif;
      }
      .loader-bar-bg {
        width: 160px;
        height: 2px;
        background: #1e212e;
        border-radius: 9999px;
        overflow: hidden;
      }
      .loader-bar-fill {
        height: 100%;
        width: 100%;
        transform-origin: left;
        transform: scaleX(0.15);
        background: linear-gradient(90deg, #6366f1, #885cf5);
        transition: transform 250ms ease-out;
        border-radius: 9999px;
      }
      @keyframes loaderIconEntrance {
        from {
          opacity: 0;
          transform: scale(0.94);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes loaderMetaEntrance {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes loaderFailsafe {
        to {
          opacity: 0;
          visibility: hidden;
          pointer-events: none;
        }
      }
      #app-loader {
        animation: loaderFailsafe 0.4s ease 3s forwards;
      }
    </style>
    <noscript>
