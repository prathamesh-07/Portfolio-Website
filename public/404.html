<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found | Prathamesh Chiddarwar</title>
    <script>
      // Single Page App redirect for GitHub Pages
      (function () {
        var l = window.location;
        var pathSegments = l.pathname.split('/');
        var isSubfolder = l.hostname.endsWith('github.io') && pathSegments.length > 2 && pathSegments[1].length > 0;
        var repoPrefix = isSubfolder ? '/' + pathSegments[1] : '';

        // Store target URL in sessionStorage to restore after index.html loads
        sessionStorage.redirect = l.pathname + l.search + l.hash;
        l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + repoPrefix + '/');
      })();
    </script>
    <noscript>
      <meta http-equiv="refresh" content="0; url=/" />
    </noscript>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #050816;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
      }
      h1 {
        font-size: 2rem;
        margin-bottom: 0.5rem;
      }
      p {
        color: #aaa6c3;
        font-size: 1rem;
        margin: 0.25rem 0;
      }
      a {
        color: #6366f1;
        text-decoration: none;
        font-weight: 600;
        margin-top: 1rem;
        display: inline-block;
      }
      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <h1>Page Not Found</h1>
    <p>Redirecting to homepage...</p>
    <p><a href="/">Click here if you are not redirected automatically</a></p>
  </body>
</html>
